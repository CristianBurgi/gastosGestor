<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head('Reportes y Gráficos')}"></head>
<body>

<nav th:replace="~{layout :: navbar('reportes')}"></nav>

<div class="container pb-5">

    <!-- Header y Selector de Mes -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="h4 mb-0 fw-bold"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Reportes y Análisis Visual</h2>
        <div class="d-flex align-items-center gap-2">
            <label for="mesInput" class="form-label mb-0 fw-semibold">Mes de análisis:</label>
            <input type="month" id="mesInput" name="mes" th:value="${mesSeleccionado}"
                   class="form-control form-control-sm" style="width: 170px;" onchange="actualizarReportes(this.value)">
        </div>
    </div>

    <!-- Cards de Métricas Rápidas -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card card-custom p-3 bg-white border-start border-success border-4">
                <div class="text-muted small fw-semibold text-uppercase">Ingresos del Mes</div>
                <div class="fs-4 fw-bold text-success" id="cardTotalIngresos">$0,00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-custom p-3 bg-white border-start border-danger border-4">
                <div class="text-muted small fw-semibold text-uppercase">Gastos del Mes</div>
                <div class="fs-4 fw-bold text-danger" id="cardTotalGastos">$0,00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-custom p-3 bg-white border-start border-primary border-4">
                <div class="text-muted small fw-semibold text-uppercase">Balance Diferencial</div>
                <div class="fs-4 fw-bold text-dark" id="cardBalance">$0,00</div>
            </div>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="row g-4">
        <!-- Gráfico de Barras: Gastos por Categoría -->
        <div class="col-lg-6">
            <div class="card card-custom p-4 bg-white h-100">
                <h5 class="card-title fw-bold mb-3">
                    <i class="bi bi-bar-chart-fill text-primary me-2"></i>Gastos por Categoría
                </h5>
                <div class="position-relative style-chart-container" style="min-height: 300px;">
                    <canvas id="categoriaChart"></canvas>
                </div>
                <div id="noDataCategoria" class="text-center text-muted py-5 d-none">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                    No hay gastos registrados en este mes.
                </div>
            </div>
        </div>

        <!-- Gráfico de Línea: Evolución Ultimos 6 Meses -->
        <div class="col-lg-6">
            <div class="card card-custom p-4 bg-white h-100">
                <h5 class="card-title fw-bold mb-3">
                    <i class="bi bi-graph-up text-success me-2"></i>Evolución de los Últimos 6 Meses
                </h5>
                <div class="position-relative style-chart-container" style="min-height: 300px;">
                    <canvas id="evolucionChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
    let chartBarras = null;
    let chartLineas = null;

    const formatter = new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        minimumFractionDigits: 2
    });

    document.addEventListener('DOMContentLoaded', () => {
        const mesActual = document.getElementById('mesInput').value;
        actualizarReportes(mesActual);
    });

    function actualizarReportes(mes) {
        // 1. Cargar métricas de balance
        fetch(`/api/v1/reportes/balance?mes=${mes}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('cardTotalIngresos').innerText = formatter.format(data.totalIngresos || 0);
                document.getElementById('cardTotalGastos').innerText = formatter.format(data.totalGastos || 0);
                document.getElementById('cardBalance').innerText = formatter.format(data.balance || 0);
            })
            .catch(err => console.error('Error al cargar balance:', err));

        // 2. Cargar gráfico por categoría
        fetch(`/api/v1/reportes/totales-por-categoria?mes=${mes}`)
            .then(res => res.json())
            .then(data => renderGraficoCategorias(data))
            .catch(err => console.error('Error al cargar categorías:', err));

        // 3. Cargar gráfico de evolución (6 meses)
        fetch(`/api/v1/reportes/evolucion?mesHasta=${mes}&meses=6`)
            .then(res => res.json())
            .then(data => renderGraficoEvolucion(data))
            .catch(err => console.error('Error al cargar evolución:', err));
    }

    function renderGraficoCategorias(data) {
        const canvas = document.getElementById('categoriaChart');
        const noDataDiv = document.getElementById('noDataCategoria');

        if (!data || data.length === 0) {
            canvas.classList.add('d-none');
            noDataDiv.classList.remove('d-none');
            if (chartBarras) chartBarras.destroy();
            return;
        }

        canvas.classList.remove('d-none');
        noDataDiv.classList.add('d-none');

        const labels = data.map(item => item.categoriaNombre);
        const montos = data.map(item => item.total);

        const backgroundColors = [
            '#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b',
            '#6f42c1', '#fd7e14', '#20c997', '#858796'
        ];

        if (chartBarras) {
            chartBarras.destroy();
        }

        chartBarras = new Chart(canvas, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Gastos ($)',
                    data: montos,
                    backgroundColor: backgroundColors.slice(0, labels.length),
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: context => ` Gasto: ${formatter.format(context.raw)}`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: value => '$' + value.toLocaleString('es-AR')
                        }
                    }
                }
            }
        });
    }

    function renderGraficoEvolucion(data) {
        const canvas = document.getElementById('evolucionChart');

        const labels = data.meses || [];
        const ingresos = data.ingresos || [];
        const gastos = data.gastos || [];

        if (chartLineas) {
            chartLineas.destroy();
        }

        chartLineas = new Chart(canvas, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Ingresos ($)',
                        data: ingresos,
                        borderColor: '#198754',
                        backgroundColor: 'rgba(25, 135, 84, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Gastos ($)',
                        data: gastos,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: context => ` ${context.dataset.label}: ${formatter.format(context.raw)}`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: value => '$' + value.toLocaleString('es-AR')
                        }
                    }
                }
            }
        });
    }
</script>

</body>
</html>
