<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Gestor de Gastos</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card-custom { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e9ecef; }
        .table-custom th { background-color: #f1f3f5; }
        .balance-card-positiva { background-color: #d1e7dd !important; border-color: #a3cfbb !important; color: #0f5132 !important; }
        .balance-card-negativa { background-color: #f8d7da !important; border-color: #f5c2c7 !important; color: #842029 !important; }
        .balance-card-neutra { background-color: #e2e3e5 !important; border-color: #d3d6d8 !important; color: #41464b !important; }
    </style>
</head>
<body>

<nav th:fragment="navbar(paginaActiva)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/gastos">
            <i class="bi bi-wallet2 me-2"></i>Gestor de Gastos
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:classappend="${paginaActiva == 'gastos' ? 'active fw-bold' : ''}" href="/gastos">
                <i class="bi bi-receipt me-1"></i>Gastos
            </a>
            <a class="nav-link" th:classappend="${paginaActiva == 'ingresos' ? 'active fw-bold' : ''}" href="/ingresos">
                <i class="bi bi-cash-stack me-1"></i>Ingresos
            </a>
            <a class="nav-link" th:classappend="${paginaActiva == 'reportes' ? 'active fw-bold' : ''}" href="/reportes">
                <i class="bi bi-graph-up-arrow me-1"></i>Reportes
            </a>
        </div>
    </div>
</nav>

</body>
</html>
