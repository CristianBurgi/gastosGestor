# ============================================================
# application.properties — configuración base (todos los perfiles)
# ============================================================

spring.application.name=gastos-personales

# Puerto configurable por entorno (Railway provee $PORT)
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA — validación de esquema contra las migraciones de Flyway
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — migraciones automáticas al arrancar
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuración de Datasource parametrizada con variables de entorno
# En producción (Railway) tomará las variables inyectadas. En local usará defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gastos_personales}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
