# ============================================================
# application.properties — configuración base (todos los perfiles)
# ============================================================

spring.application.name=gastos-personales

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA — mostrar SQL en desarrollo (se puede desactivar en prod)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
# Deshabilitar open-in-view: usamos DTOs, no necesitamos sesión abierta en la vista
spring.jpa.open-in-view=false

# Flyway — migraciones automáticas al arrancar
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuración de datasource — placeholder, NO pongas credenciales reales aquí.
# Este archivo SE VERSIONA en Git. Las credenciales reales van en application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5433/gastos_personales
spring.datasource.username=postgres
spring.datasource.password=SofiEmiNahu
spring.datasource.driver-class-name=org.postgresql.Driver
